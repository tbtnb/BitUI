<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pelican Cycling 3D</title>
<style>html,body{margin:0;width:100%;height:100%;background:#e8eee2;color:#294844;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center}.loading{text-align:center;letter-spacing:.12em}.wheel{width:44px;height:44px;margin:0 auto 18px;border:2px solid #9fae9b;border-top-color:#ce6b42;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:10px;opacity:.65;letter-spacing:.04em}</style>
</head>
<body>
<div class="loading"><div class="wheel"></div>正在载入鹈鹕的海岸骑行…<small id="status"></small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if(!('DecompressionStream' in window)) throw new Error('当前浏览器不支持 DecompressionStream，请使用较新的 Chrome / Edge / Safari / Firefox。');
    const names=Array.from({length:8},(_,i)=>`pelican/gz-${String(i+1).padStart(2,'0')}.txt`);
    status.textContent='正在读取 3D 场景数据';
    const chunks=await Promise.all(names.map(async p=>{
      const r=await fetch(p,{cache:'force-cache'});
      if(!r.ok) throw new Error(`无法读取 ${p} (${r.status})`);
      return (await r.text()).trim();
    }));
    const b64=chunks.join('');
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    status.textContent='正在展开 3D 场景';
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML=`<div style="max-width:560px;padding:32px;line-height:1.8;text-align:center"><h2>页面加载失败</h2><p>${String(err.message||err)}</p><p>请刷新页面或换用最新版浏览器。</p></div>`;
  }
})();
</script>
</body>
</html>
