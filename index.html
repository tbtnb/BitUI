<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelican Cycling 3D</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#e8eee2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#294844}.msg{padding:24px;text-align:center;line-height:1.8}</style></head><body><div class="msg">正在加载鹈鹕骑行 3D 场景…</div><script>(async()=>{try{const names=['p0.txt','p1.txt','p2.txt','p3.txt','p4.txt'];const parts=await Promise.all(names.map(n=>fetch('./payload/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('当前浏览器不支持 DecompressionStream');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="msg"><b>页面加载失败</b><br>'+String(e.message||e)+'</div>'}})();</script></body></html>
