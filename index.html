<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8eee2">
<title>顺风慢骑 · Pelican Cycling Club</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#e8eee2;color:#294844;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}body{display:grid;place-items:center}.loading{text-align:center;letter-spacing:.12em}.wheel{width:44px;height:44px;margin:0 auto 18px;border:2px solid #9fae9b;border-top-color:#ce6b42;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:10px;opacity:.65;letter-spacing:.04em}
</style>
</head>
<body>
<div class="loading"><div class="wheel"></div>正在载入鹈鹕的海岸骑行…<small id="status">同步完整 WebGL 场景</small></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const names=Array.from({length:8},(_,i)=>`pelican-src/${String(i).padStart(2,'0')}.txt`);
    const parts=[];
    for(const p of names){
      status.textContent=`正在读取 ${p}`;
      const r=await fetch(p,{cache:'no-cache'});
      if(!r.ok) throw new Error(`无法读取 ${p} (${r.status})`);
      parts.push(await r.text());
    }
    status.textContent='正在启动 3D 场景';
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML=`<div style="max-width:560px;padding:32px;line-height:1.8;text-align:center"><h2>页面加载失败</h2><p>${String(err.message||err)}</p><p>请刷新页面后重试。</p></div>`;
  }
})();
</script>
</body>
</html>
