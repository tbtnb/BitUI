<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive QA · 山东自驾手账</title><style>body{font:14px system-ui,sans-serif;background:#d9ddd6;color:#344b47;margin:0;padding:18px}header{display:flex;align-items:center;gap:16px;margin-bottom:15px}select,button{font:inherit;padding:9px;border:1px solid #acb5aa;background:white;border-radius:4px}iframe{display:block;border:0;background:#f2ecdf;box-shadow:0 6px 25px #20362c22;max-width:none;margin:0 auto}small{display:block;text-align:center;margin:10px;color:#526753}</style></head><body><header><strong>Responsive QA</strong><label>宽度 <select id="width"><option>375</option><option selected>390</option><option>430</option><option>1440</option></select></label><label>高度 <select id="height"><option selected>844</option><option>1024</option><option>1600</option></select></label><button id="restart">回到首页</button></header><iframe id="site" title="旅行手账响应式测试" src="about:blank" width="390" height="844"></iframe><small>测试辅助页 · iframe 的 CSS 视口与外部窗口独立，测试后不作为正式导航入口</small><script>const frame=document.getElementById('site'),w=document.getElementById('width'),h=document.getElementById('height');function size(){frame.width=w.value;frame.height=h.value;}w.onchange=size;h.onchange=size;document.getElementById('restart').onclick=()=>frame.src='./index.html?qa='+Date.now();frame.src='./index.html?qa='+Date.now();size();</script></body></html>
